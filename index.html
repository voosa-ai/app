<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Voosa Catalog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: clean ranked feed. Top 3 sit on a podium of large thumbnail cards; everything after is a compact ranked row. Thumbnails open the app in one click. */
:root{
  --bg:#F7F6F2; --surface:#FFFFFF; --ink:#152B62; --text:#1D2433; --soft:#5D6678; --mortar:#8E949C;
  --line:#E7E4DC; --hover:#F1EFE9; --key:#F0544F; --key-ink:#D23C37; --key-soft:#FDECEB;
  --bar:#152B62; --live:#1E8A50; --try:#B7791F;
  --shadow:0 1px 2px rgba(21,43,98,.06),0 8px 24px -16px rgba(21,43,98,.35);
  --f-body:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1530; --surface:#141E3E; --ink:#E9EEF9; --text:#E4E8F2; --soft:#A4AEC6; --mortar:#7F8AA3;
  --line:#22305A; --hover:#1A2650; --key:#F0544F; --key-ink:#FF8681; --key-soft:#3A1E2A;
  --bar:#0A1129; --live:#5FCF91; --try:#E9B45A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1530; --surface:#141E3E; --ink:#E9EEF9; --text:#E4E8F2; --soft:#A4AEC6; --mortar:#7F8AA3;
  --line:#22305A; --hover:#1A2650; --key:#F0544F; --key-ink:#FF8681; --key-soft:#3A1E2A;
  --bar:#0A1129; --live:#5FCF91; --try:#E9B45A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.7); color-scheme:dark}

body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--key);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:#FFFFFF}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:600;font-size:20px;letter-spacing:-.8px}
.bar-spacer{flex:1}
.demo{font-size:12px;color:#AFC0E4;white-space:nowrap}
.sel{background:transparent;color:#FFFFFF;border:1px solid rgba(217,227,246,.28);border-radius:999px;padding:6px 12px;font-size:13.5px;max-width:42vw}
.sel option{color:#152B62;background:#FFFFFF}
@media (max-width:560px){.demo{display:none}.brand span{display:none}}

/* header + controls */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:28px 18px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(24px,3.6vw,32px);line-height:1.15;letter-spacing:-1px;color:var(--ink);text-wrap:balance}
.sub{margin:4px 0 0;color:var(--soft);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.key{background:var(--key);border-color:var(--key);color:#FFFFFF}
.btn.key:hover{filter:brightness(1.06)}
.controls{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs{display:flex;gap:2px;background:var(--hover);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600;color:var(--soft)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.depts{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.depts::-webkit-scrollbar{display:none}
.depts button{border:0;background:none;padding:12px 0;font-size:14px;color:var(--soft);border-bottom:2px solid transparent;white-space:nowrap}
.depts button[aria-pressed="true"]{color:var(--ink);font-weight:600;border-color:var(--ink)}
.status-sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--soft);margin-block:6px}

/* thumbnails */
.thumb{position:relative;display:block;border:0;padding:0;background:var(--hover);border-radius:10px;overflow:hidden;aspect-ratio:16/10;width:100%;max-width:100%;cursor:pointer}
.thumb svg{display:block;width:100%;height:100%}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(13,21,48,.0);transition:background .15s}
.thumb .play span{opacity:0;transform:translateY(4px);transition:.15s;background:#FFFFFF;color:#152B62;font-weight:600;font-size:13px;padding:7px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.thumb:hover .play,.thumb:focus-visible .play{background:rgba(13,21,48,.35)}
.thumb:hover .play span,.thumb:focus-visible .play span{opacity:1;transform:none}
@media (hover:none){.thumb .play span{opacity:1;transform:none;font-size:12px;padding:5px 10px}.thumb .play{place-items:end;padding:8px}}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-block:22px 8px}
@media (max-width:760px){.podium{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.podium::-webkit-scrollbar{display:none}.pcard{flex:0 0 78%;scroll-snap-align:start}}
.pcard{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard.first{outline:2px solid var(--key);outline-offset:-2px}
.rank-badge{position:absolute;top:7px;right:8px;background:rgba(255,255,255,.95);color:#152B62;font-family:var(--f-mono);font-weight:500;font-size:12px;padding:3px 8px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.pcard.first .rank-badge{background:var(--key);color:#FFFFFF}
.pbody{display:flex;gap:10px;align-items:flex-start;padding:0 4px 4px}
.pbody .info{flex:1;min-width:0}

/* rows */
.list{display:flex;flex-direction:column;padding-block:8px 40px}
.row{display:grid;grid-template-columns:28px 112px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 8px;border-radius:12px}
.row:hover{background:var(--hover)}
.row + .row{border-top:1px solid var(--line)}
.row:hover + .row,.row:hover{border-color:transparent}
.rank{font-family:var(--f-mono);font-size:15px;color:var(--mortar);text-align:center;font-variant-numeric:tabular-nums}
.row .thumb{border-radius:8px}
@media (max-width:560px){.row{grid-template-columns:84px minmax(0,1fr) auto;gap:12px;padding-inline:4px}.row .rank{display:none}}

.name{all:unset;cursor:pointer;font-weight:600;font-size:16px;color:var(--ink);letter-spacing:-.3px;line-height:1.3}
.name:hover{text-decoration:underline;text-underline-offset:3px}
.name:focus-visible{outline:2px solid var(--key);outline-offset:2px;border-radius:4px}
.tagline{margin:2px 0 0;color:var(--soft);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12.5px;color:var(--mortar);flex-wrap:wrap}
.dot{display:inline-flex;align-items:center;gap:5px}
.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.dot.live{color:var(--live)}.dot.tryout{color:var(--try)}
.faces{display:inline-flex;align-items:center}
.faces i{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:9px;font-weight:700;color:#FFFFFF;border:2px solid var(--surface);margin-left:-6px}
.faces i:first-child{margin-left:0}
.row:hover .faces i{border-color:var(--hover)}
.cm{display:inline-flex;align-items:center;gap:4px}
.ready{color:var(--key-ink);font-weight:600}

/* vote */
.vote{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:52px;height:56px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;transition:transform .1s}
.vote svg{width:14px;height:14px}
.vote:active{transform:scale(.94)}
.vote[aria-pressed="true"]{background:var(--key-soft);border-color:var(--key);color:var(--key-ink)}
.vote:not([aria-pressed="true"]):hover{border-color:var(--key);color:var(--key-ink)}

/* build page */
.back{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--soft);text-decoration:none;padding-top:20px}
.back:hover{color:var(--ink)}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;padding-block:16px 28px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .thumb{border-radius:14px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(26px,4vw,36px)}
.hero .desc{margin:10px 0 0;font-size:15.5px;color:var(--soft);max-width:60ch}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.hero .actions .btn.key{padding:12px 22px;font-size:15px}
.vote.wide{flex-direction:row;height:auto;padding:11px 16px;gap:8px;min-width:0;border-radius:999px;font-size:14px}
.byline{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--soft);flex-wrap:wrap}
.bp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:28px;padding-block:8px 56px;border-top:1px solid var(--line)}
@media (max-width:860px){.bp{grid-template-columns:minmax(0,1fr)}}
.section-h{font-size:15px;font-weight:600;color:var(--ink);margin:22px 0 12px}
.progress-note{font-size:13.5px;color:var(--soft);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.progress-note.ok{background:var(--key-soft);border-color:transparent;color:var(--text)}
.progress{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--key)}
.profile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:22px;align-self:start}
.profile h2{margin:0 0 2px;font-size:15px;color:var(--ink)}
.profile .from{font-size:12px;color:var(--mortar);margin:0 0 14px}
.profile dl{margin:0;display:flex;flex-direction:column;gap:12px}
.profile dt{font-size:12px;color:var(--mortar)}
.profile dd{margin:1px 0 0;font-size:14px}

.comments{display:flex;flex-direction:column;gap:16px}
.cmt{display:flex;gap:12px;min-width:0}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#FFFFFF}
.cmt .body{min-width:0}
.cmt .who{font-weight:600;font-size:14px;color:var(--ink)}
.cmt .when{font-size:12px;color:var(--mortar);margin-left:6px}
.cmt p{margin:2px 0 0;font-size:14px;overflow-wrap:anywhere}
.add-cmt{display:flex;gap:10px;align-items:flex-start;margin-top:18px}
.add-cmt textarea{flex:1;min-width:0}
textarea,input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box;resize:vertical}

/* share dialog */
dialog{border:0;border-radius:16px;padding:0;max-width:min(440px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--text);box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(10,20,48,.5)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg h3{margin:0;font-size:19px;letter-spacing:-.4px;color:var(--ink)}
.dlg .lede{margin:0;font-size:13.5px;color:var(--soft)}
.channels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ch{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 4px;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:4px}
.ch[aria-pressed="true"]{border-color:var(--key);box-shadow:inset 0 0 0 1px var(--key);color:var(--key-ink)}
.ch svg{width:20px;height:20px}
.lock{font-size:12px;color:var(--mortar);display:flex;gap:6px;align-items:center}
.dlg .row-end{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.field label{display:block;font-size:12.5px;color:var(--soft);margin-bottom:6px}
#share-link{font-family:var(--f-mono);font-size:12.5px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;transition:.2s;pointer-events:none;max-width:calc(100vw - 32px);z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{font-size:12px;color:var(--mortar);padding-block:0 32px;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between}
.linkbtn{border:0;background:none;color:var(--soft);text-decoration:underline;padding:0;font:inherit}
.crit-lane{margin-top:22px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 8px}
.crit-lane .lane-h{display:flex;align-items:center;gap:8px;padding:8px 8px 2px;font-size:13px;font-weight:600;color:var(--ink)}
.crit-lane .lane-h small{font-weight:400;color:var(--mortar)}
.crit-lane .row{grid-template-columns:28px 112px minmax(0,1fr) auto}
.crit-lane .row + .row{border-top:1px solid var(--line)}
.shield{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--ink);color:var(--bg)}
.crit{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-weight:600}
.crit-why{margin:4px 0 0;font-size:13px;color:var(--soft)}
.crit-note{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-top:12px}
.crit-form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.crit-form input{flex:1 1 220px}
@media (max-width:560px){.crit-lane .row{grid-template-columns:84px minmax(0,1fr) auto}}
.empty{text-align:center;padding:48px 16px;color:var(--soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <a class="brand" href="#" aria-label="Voosa home">
      <svg width="36" height="20" viewBox="0 32 200 112" aria-hidden="true"><g data-arch="#FFFFFF"></g></svg>
      <span>voosa</span>
    </a>
    <span class="bar-spacer"></span>
    <span class="demo">Demo, sample data</span>
    <select class="sel" id="co" aria-label="Company"></select>
    <select class="sel" id="me" aria-label="Signed in as"></select>
  </div>
</header>

<main id="app" class="wrap"></main>

<div class="wrap foot">
  <span>Preview of spec 04, catalog and voting. Nothing here is sent anywhere.</span>
  <button class="linkbtn" id="reset">Reset sample votes and comments</button>
</div>

<dialog id="share" aria-labelledby="share-title">
  <form class="dlg" method="dialog" id="share-form">
    <h3 id="share-title">Share</h3>
    <p class="lede" id="share-sub"></p>
    <div class="channels" role="group" aria-label="How to share">
      <button type="button" class="ch" data-ch="link" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>Copy link</button>
      <button type="button" class="ch" data-ch="email" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Email</button>
      <button type="button" class="ch" data-ch="teams" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M7 10h4M9 10v5"/><circle cx="18" cy="8" r="2"/><path d="M15 13h6v3a3 3 0 0 1-6 0"/></svg>Teams</button>
      <button type="button" class="ch" data-ch="slack" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3v8M15 13v8M3 15h8M13 9h8"/></svg>Slack</button>
    </div>
    <div class="field" id="to-field" hidden>
      <label for="share-to">To (coworkers at <span id="share-co"></span>)</label>
      <input type="text" id="share-to" placeholder="Name or email">
    </div>
    <div class="field">
      <label for="share-note">Note (optional)</label>
      <textarea id="share-note" rows="2" placeholder="This saves me an hour a week, vote for it"></textarea>
    </div>
    <div id="link-row"><input type="text" id="share-link" readonly aria-label="Build link"></div>
    <div class="lock"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Only signed-in members of this company can open the link.</div>
    <div class="row-end">
      <button type="button" class="btn" id="share-cancel">Cancel</button>
      <button type="submit" class="btn key" id="share-go">Copy link</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
/* ---------- logo ---------- */
var CY=104,BASE=136,RED='#F0544F';
function pt(r,d){var t=d*Math.PI/180;return[(100+r*Math.cos(t)).toFixed(2),(CY-r*Math.sin(t)).toFixed(2)]}
function wedge(R,r,a1,a2){var p1=pt(R,a1),p2=pt(R,a2),p3=pt(r,a2),p4=pt(r,a1);return'M'+p1[0]+' '+p1[1]+' A'+R+' '+R+' 0 0 1 '+p2[0]+' '+p2[1]+' L'+p3[0]+' '+p3[1]+' A'+r+' '+r+' 0 0 0 '+p4[0]+' '+p4[1]+' Z'}
function arch(stone){var n=5,gap=6,key=44,span=(180-gap*(n-1)-key)/(n-1),a=180,s='';for(var i=0;i<n;i++){var k=i===2,w=k?key:span;s+='<path d="'+wedge(64,26,a,a-w)+'" fill="'+(k?RED:stone)+'"/>';a=a-w-gap}
s+='<path d="M36 '+(CY+5)+' H74 V'+BASE+' H36 Z" fill="'+stone+'"/><path d="M126 '+(CY+5)+' H164 V'+BASE+' H126 Z" fill="'+stone+'"/>';return s}
document.querySelectorAll('g[data-arch]').forEach(function(g){g.innerHTML=arch(g.getAttribute('data-arch'))});

/* ---------- sample data ---------- */
var THRESHOLD=5;
var COMPANIES={
  omitz:{name:'Omitz',depts:['Field Safety','Training','Regulatory'],members:['phil','doug','maria','jordan','priya','sam','tom']},
  personal:{name:'Phil personal',depts:['Work','Money','Family','Outdoors'],members:['phil','doug','jen','kids']}
};
var PEOPLE={phil:'Phil Clark',doug:'Doug Stillings',maria:'Maria Lopez',jordan:'Jordan Reyes',priya:'Priya Shah',sam:'Sam Okafor',tom:'Tom Becker',jen:'Jen Clark',kids:'The kids'};
var COLORS={phil:'#152B62',doug:'#2F6B8E',maria:'#7A4FA0',jordan:'#B5582A',priya:'#2E7D5B',sam:'#8E5A2B',tom:'#5B6B7A',jen:'#A0456E',kids:'#C7362F'};
function d(s){return new Date(s+'T15:00:00Z').getTime()}
var BUILDS=[
 {id:'ethics-compass',co:'omitz',name:'Ethics Compass',full:'Ethics Compass Interactive Training',dept:'Training',tool:'Lovable',status:'live',up:d('2026-08-12'),kind:'quiz',hue:'#6B4FA0',
  tag:'Ethics training built from real consulting dilemmas',

function catalog(){

  list.sort(state.sort==='top'?function(a,b){return b.votes.length-a.votes.length||b.up-a.up}:function(a,b){return b.up-a.up});
  var h='<div class="head"><div><h1>'+esc(co.name)+' builds</h1><p class="sub">Open anything with one click. Vote for what helps your work.</p></div><button class="btn primary" id="upload">+ Upload a build</button></div>';
  h+='<div class="controls"><div class="tabs" role="group" aria-label="Sort"><button data-sort="top" aria-pressed="'+(state.sort==='top')+'">Top</button><button data-sort="new" aria-pressed="'+(state.sort==='new')+'">New</button></div>'+
     '<div class="depts" role="group" aria-label="Department">'+['all'].concat(co.depts).map(function(dp){return'<button data-dept="'+esc(dp)+'" aria-pressed="'+(state.dept===dp)+'">'+(dp==='all'?'All':esc(dp))+'</button>'}).join('')+'</div>'+
     '<select class="status-sel" id="status" aria-label="Status"><option value="all">Any status</option><option value="tryout">Try-out</option><option value="live">Live</option></select></div>';
  if(!list.length)return h+'<div class="empty">No builds match these filters yet.</div>';

  if(state.sort==='top'){crit=list.filter(function(b){return b.critical});list=list.filter(function(b){return!b.critical})}
  if(crit.length){h+='<section class="crit-lane" aria-label="Critical apps"><div class="lane-h"><span class="shield">'+SHIELD+'</span>Critical <small>Marked by leadership, regardless of votes</small></div>';
    crit.forEach(function(b){h+='<article class="row"><span class="rank"></span>'+thumb(b)+'<div style="min-width:0"><button class="name" data-open="'+b.id+'">'+esc(b.name)+'</button><p class="crit-why">\u201c'+esc(b.critical.why)+'\u201d \u2014 '+esc(PEOPLE[b.critical.by])+'</p>'+meta(b)+'</div>'+voteBtn(b)+'</article>'});
    h+='</section>'}
  var top=state.sort==='top'?list.slice(0,Math.min(3,list.length)):[];
  var rest=list.slice(top.length);
  if(top.length){h+='<div class="podium">';top.forEach(function(b,i){
    h+='<article class="pcard'+(i===0?' first':'')+'">'+thumb(b,'<span class="rank-badge">#'+(i+1)+'</span>')+

  var n=b.votes.length,p=b.profile;
  var h='<a class="back" href="#">← '+esc(COMPANIES[b.co].name)+' builds</a>';
  h+='<section class="hero">'+thumb(b)+'<div style="min-width:0"><h1>'+esc(b.full||b.name)+'</h1><p class="desc">'+esc(b.desc)+'</p>'+
     '<div class="actions"><button class="btn key" data-launch="'+b.id+'">Open app ↗</button>'+voteBtn(b,true)+'<button class="btn" data-share="'+b.id+'">'+SHARE+'Share</button></div>'+
     '<div class="byline"><span class="av" style="width:24px;height:24px;font-size:10px;background:'+COLORS.phil+'">PC</span>'+esc(PEOPLE.phil)+' · built with '+esc(b.tool)+' · '+fmt(b.up)+' · '+statusDot(b)+'</div></div></section>';
  h+='<div class="bp"><div style="min-width:0">';
  var owner=OWNERS.indexOf(state.me)>=0;
  if(b.critical)h+='<div class="crit-note"><span class="shield">'+SHIELD+'</span><div><strong>Marked critical</strong> by '+esc(PEOPLE[b.critical.by])+', '+fmtS(b.critical.t)+'. \u201c'+esc(b.critical.why)+'\u201d'+(owner?' <button class="linkbtn" data-uncrit="'+b.id+'">Remove</button>':'')+'</div></div>';
  else if(owner)h+='<form class="crit-form" id="crit-form"><input type="text" id="crit-why" placeholder="Why is this critical? e.g. Required for our OSHA program" aria-label="Reason this app is critical"><button class="btn" type="submit">'+SHIELD+' Mark critical</button></form>';
  h+='<div style="margin-top:22px">'+(b.critical&&n<THRESHOLD?'<div class="progress-note ok"><strong>Ready for analysis.</strong> Marked critical, so Voosa will look at how it connects to the rest of '+esc(COMPANIES[b.co].name)+' without waiting for votes.</div>':n>=THRESHOLD?'<div class="progress-note ok"><strong>Ready for analysis.</strong> '+n+' people voted for this, so Voosa will look at how it connects to the rest of '+esc(COMPANIES[b.co].name)+'.</div>':
     '<div class="progress-note">'+(THRESHOLD-n)+' more vote'+(THRESHOLD-n===1?'':'s')+' until Voosa looks at how this connects to the rest of '+esc(COMPANIES[b.co].name)+'. Shared '+b.shares+' time'+(b.shares===1?'':'s')+' so far.<div class="progress"><span style="width:'+(n/THRESHOLD*100)+'%"></span></div></div>')+'</div>';
  if(n)h+='<div class="meta" style="margin-top:12px">'+faces(b)+'<span>'+b.votes.map(function(u){return PEOPLE[u].split(' ')[0]}).join(', ')+' voted</span></div>';
  h+='<h2 class="section-h">Comments'+(b.comments.length?' · '+b.comments.length:'')+'</h2><div class="comments">';
  if(!b.comments.length)h+='<p style="margin:0;color:var(--soft);font-size:14px">No comments yet. Say how you would use it.</p>';
  b.comments.forEach(function(c){h+='<div class="cmt"><div class="av" style="background:'+COLORS[c.u]+'">'+initials(c.u)+'</div><div class="body"><span class="who">'+esc(PEOPLE[c.u])+'</span><span class="when">'+fmtS(c.t)+'</span><p>'+esc(c.b)+'</p></div></div>'});
  h+='</div><form class="add-cmt" id="cmt-form"><div class="av" style="background:'+COLORS[state.me]+'">'+initials(state.me)+'</div><textarea id="cmt" rows="2" aria-label="Comment as '+esc(PEOPLE[state.me])+'" placeholder="How would this help your work?"></textarea><button class="btn primary" type="submit">Post</button></form></div>';
  h+='<aside class="profile"><h2>Build Profile</h2><p class="from">From the builder’s AI interview (sample)</p><dl>'+
     '<div><dt>Purpose</dt><dd>'+esc(p.purpose)+'</dd></div><div><dt>Who uses it</dt><dd>'+esc(p.users)+'</dd></div>'+
     '<div><dt>Who else should know</dt><dd>'+esc(p.stake)+'</dd></div><div><dt>Workflow step</dt><dd>'+esc(p.step)+'</dd></div>'+
     '<div><dt>Data in / out</dt><dd>'+esc(p.data)+'</dd></div><div><dt>Replaces</dt><dd>'+esc(p.work)+'</dd></div></dl></aside></div>';
  return h;
}

/* ---------- render + events ---------- */
var app=document.getElementById('app');
function current(){var b=byId(location.hash.slice(1));if(b&&b.co!==state.co){state.co=b.co;coSel.value=b.co;fillMe()}return b}
function render(){
  var b=current();
  app.innerHTML=b?buildPage(b):catalog();
  var cf=document.getElementById('crit-form');if(b&&cf)cf.onsubmit=function(e){e.preventDefault();var w=document.getElementById('crit-why').value.trim();if(!w){toast('Add a reason so people know why it matters');return}b.critical={by:state.me,t:new Date().toISOString().slice(0,10),why:w};save();render();toast(b.name+' marked critical')};
  if(b){document.getElementById('cmt-form').onsubmit=function(e){e.preventDefault();var v=document.getElementById('cmt').value.trim();if(!v)return;b.comments.push({u:state.me,t:new Date().toISOString().slice(0,10),b:v});save();render();toast('Comment posted')}}
  else{document.getElementById('upload').onclick=function(){toast('Upload is spec 02. New builds land here under New.')};
    var st=document.getElementById('status');st.value=state.status;st.onchange=function(){state.status=st.value;render()}}
}
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-uncrit],[data-vote],[data-open],[data-share],[data-sort],[data-dept],[data-launch]');if(!t)return;
  if(t.dataset.uncrit){byId(t.dataset.uncrit).critical=null;save();render();toast('Critical flag removed')}
  else if(t.dataset.vote){var b=byId(t.dataset.vote),i=b.votes.indexOf(state.me);if(i>=0){b.votes.splice(i,1);toast('Vote removed')}else{b.votes.push(state.me);toast(b.votes.length===THRESHOLD?b.name+' is now ready for analysis':'Voted for '+b.name)}save();render()}
  else if(t.dataset.launch){toast('Opens '+byId(t.dataset.launch).name+' in a new tab once it’s uploaded for real.')}
  else if(t.dataset.open){location.hash=t.dataset.open}
  else if(t.dataset.share){openShare(byId(t.dataset.share))}
  else if(t.dataset.sort){state.sort=t.dataset.sort;save();render()}
  else if(t.dataset.dept){state.dept=t.dataset.dept;render()}
});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});
document.getElementById('reset').onclick=function(){apply(JSON.parse(SEED));save();render();toast('Sample data reset')};

/* ---------- share ---------- */
var dlg=document.getElementById('share'),shareB=null,channel='link';
var CH={link:'Copy link',email:'Send email',teams:'Send in Teams',slack:'Send in Slack'};
function setCh(c){channel=c;dlg.querySelectorAll('.ch').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.ch===c)});document.getElementById('to-field').hidden=c==='link';document.getElementById('link-row').hidden=c!=='link';document.getElementById('share-go').textContent=CH[c]}
dlg.querySelectorAll('.ch').forEach(function(x){x.onclick=function(){setCh(x.dataset.ch)}});
function openShare(b){shareB=b;document.getElementById('share-title').textContent='Share '+b.name;
  document.getElementById('share-sub').textContent='Ask coworkers to try it and vote. Shared '+b.shares+' time'+(b.shares===1?'':'s')+' so far.';
  document.getElementById('share-co').textContent=COMPANIES[b.co].name;
  document.getElementById('share-link').value='https://app.voosa.ai/'+state.co+'/builds/'+b.id;
  document.getElementById('share-note').value='';document.getElementById('share-to').value='';setCh('link');
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','')}
document.getElementById('share-cancel').onclick=function(){dlg.close()};
document.getElementById('share-form').onsubmit=function(e){e.preventDefault();var msg;
  if(channel==='link'){var v=document.getElementById('share-link');try{navigator.clipboard.writeText(v.value).catch(function(){v.select()})}catch(err){v.select()}msg='Link copied'}
  else{var to=document.getElementById('share-to').value.trim()||'coworkers';msg='Preview only: in the real product this goes to '+to+' by '+{email:'email',teams:'Teams',slack:'Slack'}[channel]+'.'}
  shareB.shares++;save();dlg.close();render();toast(msg)};

render();
})();
</script>
</body>
